name: TrustTap CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: trusttap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & route tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedbackflow
          POSTGRES_PASSWORD: feedbackflow
          POSTGRES_DB: feedbackflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedbackflow -d feedbackflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://feedbackflow:feedbackflow@127.0.0.1:5432/feedbackflow?schema=public
      ADMIN_SECRET: local-dev-admin-secret
      E2E_ADMIN_SECRET: local-dev-admin-secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: noreply@commiters.com
      SMTP_PASS: test
      SMTP_FROM: TrustTap <noreply@commiters.com>
      ALERT_PHONE_MODE: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
