version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: feedbackflow-postgres
    environment:
      POSTGRES_USER: feedbackflow
      POSTGRES_PASSWORD: feedbackflow
      POSTGRES_DB: feedbackflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
